 culto`,image:`${S}/setup/servicio-de-culto.webp`,finalGirl:`sendero-suroeste`,killer:`pradera`,victims:{"bosque-oeste":1,mirador:1,puente:2,"arboles-sagrados":2,orilla:2,"bosque-este":2,poblado:2}}],eventBack:`${S}/events/back.webp`,events:[{id:`cerrado-por-mantenimiento`,name:`Cerrado por mantenimiento`,image:`${S}/events/cerrado-por-mantenimiento.webp`,flavor:`«Menos mal que hay un espacio sagrado menos para que desfilen estos pringados.»`,text:`Cuando se revele, puedes descartar TODAS tus cartas de Acción excepto Expiar para cerrar un espacio Sagrado: coloca allí la ficha de Cerrado y mueve sus Víctimas a los espacios adyacentes (repartidas). Las Víctimas ya no pueden entrar allí por ninguna razón; tú y los Enemigos sí podéis entrar y salir.`,token:`cerrado`,onReveal:[],persistent:!0,custom:`ev-closed`},{id:`fuego-y-azufre`,name:`Fuego y azufre`,image:`${S}/events/fuego-y-azufre.webp`,flavor:`«Aparentemente este sitio es mega sagrado, así que mejor trabajo extra duro para mantener a esta gentuza alejada.»`,text:`Tira un dado y coloca la ficha de Fuego y azufre en: 1-2 Cementerio, 3-4 Santuario Sagrado, 5-6 Árboles Sagrados. Cada Víctima de ese espacio cuenta como 2 Víctimas al calcular los Aumentos de la Ira Divina.`,token:`fuego-y-azufre`,onReveal:[],persistent:!0,custom:`ev-fire-brimstone`},{id:`suelo-sagrado`,name:`Suelo sagrado`,image:`${S}/events/suelo-sagrado.webp`,flavor:`«No invierto demasiado en lo sobrenatural pero aún así siento que este lugar es diferente.»`,text:`Tira un dado y coloca la ficha de Suelo sagrado en: 1-2 Cementerio, 3-4 Santuario Sagrado, 5-6 Árboles Sagrados. Cada vez que terminas una fase de Acción en ese espacio, ganas 2 Tiempo.`,token:`suelo-sagrado`,onReveal:[],persistent:!0,custom:`ev-sacred-ground`},{id:`el-super-turista`,name:`El super turista`,image:`${S}/events/el-super-turista.webp`,flavor:`«¡HULA! ¡MI NOMBRE ES FRANZ! ¡NO, NO ESTOY GRITANDO! ¡MI VOZ ES ASÍ!»`,text:`La Víctima más alejada del Asesino es ahora el Super Turista. Cada vez que el Asesino elija Objetivo, elige al Super Turista. Si el Super Turista es salvado, reduce la Ira Divina o la Asesina en 4. Si muere, aumenta la Ira Divina en 4. Si el Super Turista deja de jugar, descarta esta carta.`,specialVictim:`white`,onReveal:[],persistent:!0,custom:`ev-super-tourist`},{id:`el-hombre-sagrado`,name:`El hombre sagrado`,image:`${S}/events/el-hombre-sagrado.webp`,flavor:`«¿Qué tipo de peregrino demente es este tipo?»`,text:`La Víctima más alejada del Asesino es ahora el Hombre Sagrado. No te sigue. En cada fase de Mantenimiento se mueve un espacio hacia el Asesino. Cuando esté en el mismo espacio que el Asesino, quítalo del tablero: si estabas en su espacio, reduce la Ira Asesina o la Divina a 4; si no, aumenta la Ira Asesina y la Divina 10 en total (tú eliges). Si el Hombre Sagrado deja de jugar, descarta esta carta.`,specialVictim:`blue`,onReveal:[],persistent:!0,custom:`ev-holy-man`},{id:`el-guia-turistico`,name:`El guía turístico`,image:`${S}/events/el-guia-turistico.webp`,flavor:`«Y si miran a su derecha verán… Oh cielos… eso es terrorífico. ¿Quizá deberíamos tomar una ruta distinta?»`,text:`La Víctima más cercana a ti es el Guía Turístico. Mientras esté contigo, una vez por turno, cuando te muevas al menos 1 espacio, puedes moverte otro adicional. Si el Guía Turístico muere, aumenta la Ira Divina en 6. Si deja de jugar, descarta esta carta.`,specialVictim:`green`,onReveal:[],persistent:!0,custom:`ev-tour-guide`},{id:`ruidosos-y-odiosos`,name:`Ruidosos y odiosos`,image:`${S}/events/ruidosos-y-odiosos.webp`,flavor:`«Estos turistas son tan molestos que me dan ganas de matarlos a mí misma.»`,text:`Cada vez que la Ira Divina aumente, auméntala 1 más.`,onReveal:[],persistent:!0,custom:`ev-loud-obnoxious`},{id:`los-dioses-odian-los-fallos`,name:`Los dioses odian los fallos`,image:`${S}/events/los-dioses-odian-los-fallos.webp`,flavor:`«Igual podríamos añadir a los dioses a la lista de la gente que piensa que soy un desastre.»`,text:`  éxitos: Desata la Ira Divina y auméntala tanto como Víctimas haya en espacios Sagrados. Puedes gastar 3 Tiempo durante la fase de Acción para descartar esta carta.`,effects:[],stays:`hz-fickle-gods`}],items:[{id:`tapadera`,name:`Tapadera`,image:`${S}/items/tapadera.webp`,flavor:`«Discúlpame mientras ¡SACO LA BASURA! Je je, ¿lo pillas?»`,text:`Ignora 1 punto de daño de un ataque. 3 usos.`,hands:1,uses:3,custom:`item-trash-lid`},{id:`daga-ceremonial`,name:`Daga ceremonial`,image:`${S}/items/daga-ceremonial.webp`,flavor:`«A los dioses siempre les gustó un poco de sangría, así que no sería bueno decepcionarles.»`,text:`Arma: alcance 0, +1 de daño. Cada vez que haces daño al Asesino, elige la Ira Asesina o la Divina y redúcela en 1.`,hands:1,range:[0,0],damage:1,modifies:`any`,custom:`item-ceremonial-dagger`},{id:`pildoras-misteriosas`,name:`Píldoras misteriosas`,image:`${S}/items/pildoras-misteriosas.webp`,flavor:`«Por favor, que no sean un laxante.»`,text:`Descártalas durante la fase de Acción y elige: −1 Terror o recupera 2 Vida.`,hands:0,custom:`item-mystery-pills`},{id:`huesos-del-shaman`,name:`Huesos del shamán`,image:`${S}/items/huesos-del-shaman.webp`,flavor:`«Nada como los huesos de un tipo sagrado cuando necesitas asomarte al futuro.»`,text:`Mira la siguiente carta de Horror y colócala encima o debajo del todo del mazo de Horror. 3 usos.`,hands:1,uses:3,custom:`item-shaman-bones`},{id:`mascara-tribal`,name:`Máscara tribal`,image:`${S}/items/mascara-tribal.webp`,flavor:`«¿Por qué solo van a divertirse con las máscaras los maníacos?»`,text:`Cada vez que recibes daño, elige la Ira Asesina o la Divina y redúcela tanto como el daño recibido.`,hands:0,custom:`item-tribal-mask`},{id:`bebida-energetica`,name:`Bebida energética`,image:`${S}/items/bebida-energetica.webp`,flavor:`«Zoom zoom, baby, ¡mira cómo voy!»`,text:`Descártala durante la fase de Acción y elige: +3 Tiempo o muévete 1 zona.`,hands:0,custom:`item-energy-drink`},{id:`viejo-rifle`,name:`Viejo rifle`,image:`${S}/items/viejo-rifle.webp`,flavor:`«Este cacharro no se ha limpiado en una década, pero ¡rayos, aún puede disparar!»`,text:`Arma: alcance 1-2, sin daño adicional. Solo puede modificar la carta de Acción Ataque débil. Si estás en un espacio Sagrado, +2 al alcance máximo.`,hands:2,range:[1,2],damage:0,modifies:[`ataque-debil`],custom:`item-old-rifle`},{id:`palo-de-guerra`,name:`Palo de guerra`,image:`${S}/items/palo-de-guerra.webp`,flavor:`«Este palo es solo de exposición, pero es hora de ponerlo a funcionar.»`,text:`Arma: alcance 0, +1 de daño. Cada vez que haces daño con el Palo de guerra, elige la Ira Asesina o la Divina y redúcela tanto como el daño infligido.`,hands:2,range:[0,0],damage:1,modifies:`any`,custom:`item-war-club`},{id:`kit-de-primeros-auxilios`,name:`Kit de primeros auxilios`,image:`${S}/items/kit-de-primeros-auxilios.webp`,flavor:`«Tengo que parar la hemorragia antes de perder la consciencia.»`,text:`Cada vez que uses una carta de Acción para recuperar Vida, recupera 1 más.`,hands:1,custom:`item-first-aid`},{id:`senales-fuera-de-servicio`,name:`Señales de fuera de servicio`,image:`${S}/items/senales-fuera-de-servicio.webp`,flavor:`«Un poco de confusión vendrá bien.»`,text:`Por 1 Tiempo, coloca o retira una ficha de Fuera de servicio en la unión entre tu espacio y uno adyacente (2 fichas). Las Víctimas no pasarán por ella, a menos que te estén siguiendo.`,hands:0,token:`fuera-de-servicio`,custom:`item-out-of-order`},{id:`bocina`,name:`Bocina`,image:`${S}/items/bocina.webp`,flavor:`«La herramienta perfecta para pastorear a estos cabeza-huecas de turistas.»`,text:`Por 1 Tiempo, todas las Víctimas de tu espacio y de los adyacentes huyen.`,hands:0,custom:`item-air-horn`},{id:`incienso`,name:`Incienso`,image:`${S}/items/incienso.webp`,flavor:`«Parece ser que a los dioses les gusta el humo que huele bien. Oye, lo que sea, ¡funciona!»`,text:`Cada vez que la Ira Asesina o la Divina aumente, auméntala 1 menos (aumento mínimo de 1).`,hands:0,custom:`item- ia:4}},{id:`corro-alrededor-de-rosie`,name:`Corro alrededor de Rosie`,image:`${T}/setup/corro-alrededor-de-rosie.webp`,finalGirl:`cosas-alucinantes`,killer:`tiro-al-blanco`,victims:{"bosque-horrores":1,"plaza-oeste":1,"casa-espejos":1,"sendero-sur":2,"gran-carpa":3,explanada:1,taquilla:1,"plaza-este":1,"casa-palomitas":2}},{id:`tarde-para-el-show`,name:`Tarde para el show`,image:`${T}/setup/tarde-para-el-show.webp`,finalGirl:`salida`,killer:`gran-carpa`,victims:{"bosque-horrores":2,"tiro-al-blanco":1,"coche-payaso":1,"cosas-alucinantes":1,"jaulas-animales":2,"casa-palomitas":3,noria:2}}],eventBack:`${T}/events/back.webp`,events:[{id:`transporte-de-empleados`,name:`Transporte de empleados`,image:`${T}/events/transporte-de-empleados.webp`,flavor:`«Parece que alguien se ha dejado las llaves puestas en el carro…»`,text:`Pon la ficha del Carro de Golf en uno de los 4 espacios de esquina. Durante el Mantenimiento: tú y/o hasta 2 Víctimas del espacio del Carro podéis conducirlo hasta 2 espacios, pero debe quedarse en el lado más externo. Si el Carro llega a un espacio con un Enemigo, puedes descartarlo para hacerle 3 de daño. Si se elimina la ficha, descarta esta carta.`,token:`carro-de-golf`,onReveal:[],persistent:!0,custom:`ev-golf-cart`},{id:`no-es-real`,name:`No es real`,image:`${T}/events/no-es-real.webp`,flavor:`«Estos efectos especiales están locos, ¡eso parece realmente un cadáver!»`,text:`Pon 4 nuevas Víctimas en la Casa de los Espejos. Coloca la ficha de la Calavera en el Bosque de los Horrores. Cualquier Víctima en o moviéndose al Bosque de los Horrores es asesinada inmediatamente.`,token:`calavera`,onReveal:[],persistent:!0,custom:`ev-not-real`},{id:`me-seguiste-hasta-aqui`,name:`¿Me seguiste hasta aquí?`,image:`${T}/events/me-seguiste-hasta-aqui.webp`,flavor:`«¿¡Por qué siempre te me pegas?!»`,text:`Coloca 4 nuevas Víctimas en la Gran Carpa. Una de ellas es una Víctima Especial: tu osada Hermana menor. Mientras tu Hermana esté en tu espacio, puedes gastar 2 Tiempo para volver a lanzar un dado. Si la Hermana muere, +2 Sed de Sangre. Si la Hermana deja de jugar, descarta esta carta.`,onReveal:[],persistent:!0,custom:`ev-sister`},{id:`corre-yo-les-entretendre`,name:`¡Corre, yo les entretendré!`,image:`${T}/events/corre-yo-les-entretendre.webp`,flavor:`«Hay una delgada línea entre el coraje y la idiotez.»`,text:`La Víctima más cercana a ti es tu Prometido. Si un Enemigo quisiera entrar en tu espacio mientras tu Prometido está allí, mata en su lugar a tu Prometido y el Enemigo se queda donde está. Si tu Prometido muere por una trampa, +5 Terror. Si el Prometido abandona el juego, descarta esta carta.`,specialVictim:`blue`,onReveal:[],persistent:!0,custom:`ev-fiance`},{id:`luna-llena`,name:`Luna llena`,image:`${T}/events/luna-llena.webp`,flavor:`«No oía ese aullido desde que estaba en mi tierra…»`,text:`La Víctima más lejana a ti es ¡un Hombre Lobo! No te seguirá y no puede ser apuntado, salvado ni asesinado. Durante el Mantenimiento: el Hombre Lobo entra en pánico y luego hace 2 de daño a un objetivo en su espacio por esta prioridad: Víctima ▶ tú ▶ Esbirro ▶ Asesino.`,specialVictim:`orange`,onReveal:[],persistent:!0,custom:`ev-werewolf`},{id:`espejos-por-todas-partes`,name:`Espejos por todas partes`,image:`${T}/events/espejos-por-todas-partes.webp`,flavor:`«¡Creo que los tengo! Oh no…»`,text:`Si atacas y hay una o más Víctimas en tu espacio, una Víctima muere por cada 1 que saques.`,onReveal:[],persistent:!0,custom:`ev-mirrors`},{id:`demasiada-basura`,name:`Demasiada basura`,image:`${T}/events/demasiada-basura.webp`,flavor:`«Seguro que alguien necesita una intervención por acumulación de trastos.»`,text:`Cuando se revele, busca la carta de Objeto de Zappo y ponla en tu mochila (rebarajando el mazo si es necesario). Si pierdes a Zappo, tira un dado menos (mínimo 1) cuando resuelvas una carta de Acción de Buscar el resto de la partida.`,onReveal:[],persistent:!0,custom:`ev-too-much-junk`},{id:`como-puede-ser-de-peligroso`,name:`¿Cómo puede ser de peligroso?`,image:`${T}/events/como-puede-ser-de-peligroso.webp`,flavor:`«Sostenme la cerveza.»`,text:`Durante el Mantenimiento cada Víctima se mueve 1 espacio hacia la ficha de Trampa más cercana.`,onReveal:[],persistent:!0,custom:`ev-so-dangerous`},{id:`payasos-por-doquier`,name:`Payasos por doquier`,image:`${T}/events/payasos-por-doquier.webp`,flavor:`«¿Has oído un bocinazo?»`,text:`Durante el Mantenimiento las Víctimas en la Gran Carpa y espacios adyacentes entran en pánico. Si entran en un espacio con un Enemigo, mueren inmediatamente.`,onReveal:[],persistent:!0,custom:`ev-clowns`},{id:`panico-animal`,name:`¡Pánico animal!`,image:`${T}/events/panico-animal.webp`,flavor:`«Leones y tigres y osos, ¡por favor!»`,text:`Cada vez que el nivel de Horror aumente, tira tantos dados como el nuevo nivel de Horror: por cada éxito puedes mover una Víctima de tu elección 1 espacio; por cada dos dados que no sean éxito, muere una Víctima.`,onReveal:[],persistent:!0,custom:`ev-animal-panic`}],horror:[{id:`estoy-atrapada`,name:`«¡Estoy atrapada y no puedo salir!»`,copies:1,image:`${T}/horror/estoy-atrapada.webp`,text:`Objetivo la Chica Final ▶ mover ▶ atacar. Pon la ficha de Trampa de Red de Cuerda en tu zona y aplica sus efectos a ti y a las Víctimas de tu espacio. Si descartas una carta de Caminar o Correr: +2 Terror.`,effects:[Me(`finalGirl`,1,1),Ne(`cn-trap:red`)]},{id:`quema-quema`,name:`«¡Quema, quema!»`,copies:1,image:`${T}/horror/quema-quema.webp`,text:`Pon la ficha de Trampa de Ácido en tu zona y aplica sus efectos a ti y a todas las Víctimas de tu espacio. +2 Terror.`,effects:[Ne(`cn-trap:acid`),{kind:`terror`,amount:2}]},{id:`de-donde-salen-las-cuchillas`,name:`«¿De dónde diablos salen las cuchillas?»`,copies:1,image:`${T}/horror/de-donde-salen-las-cuchillas.webp`,text:`Pon la ficha de Trampa de Sierras Giratorias en tu zona y aplica sus efectos a ti y a todas las Víctimas de tu espacio. Por cada 1-4 que saques: +1 Terror.`,effects:[Ne(`cn-trap:saws`)]},{id:`brumosa-emboscada`,name:`Brumosa emboscada`,copies:1,image:`${T}/horror/brumosa-emboscada.webp`,text:`Todas las Víctimas en o adyacentes al Bosque de los Horrores entran en pánico; por cada 1 que saques, la Víctima muere. Si al menos una Víctima muere: +1 Terror. Si ninguna muere, resuelve la siguiente carta de Terror.`,effects:[Ne(`cn-ambush`)]},{id:`como-puede-haber-tantas-trampas`,name:`«¿Cómo puede haber tantas trampas?»`,copies:1,image:`${T}/horror/como-puede-haber-tantas-trampas.webp`,text:`Si no hay cartas de Objeto Trampa en el descarte de Objetos, descarta y roba la siguiente carta de Terror. Si no: baraja todas las cartas bocabajo de los mazos de Objeto con los Objetos Trampa descartados, repártelas de nuevo y pon los Objetos superiores bocarriba. Objetivo la Víctima más cercana ▶ mover ▶ atacar. +1 Terror.`,effects:[Ne(`cn-rebuild`)]},{id:`esto-es-un-apoyo`,name:`«¿Esto es un apoyo?»`,copies:1,image:`${T}/horror/esto-es-un-apoyo.webp`,text:`Roba un Evento. Descarta al azar una carta de Objeto; si no tienes ninguno, descarta la carta superior del mazo de Objeto más cercano. Objetivo la Víctima más cercana ▶ mover ▶ atacar.`,effects:[{kind:`drawEvent`},Ne(`cn-support`),Me(`victim`,1,1)]},{id:`bienvenidos-al-mayor-show`,name:`Bienvenidos al mayor show`,copies:1,image:`${T}/horror/bienvenidos-al-mayor-show.webp`,text:`Roba un Evento. Todas las Víctimas se mueven 1 espacio hacia la Gran Carpa. Pon al Asesino en la Gran Carpa. Objetivo el más cercano ▶ atacar ▶ mover.`,effects:[{kind:`drawEvent`},Ne(`cn-victims-toward:gran-carpa`),Ne(`cn-killer-to:gran-carpa`),Me(`nearest`,1,1,{attackFirst:!0})]},{id:`como-se-ha-escapado-el-leon`,name:`«¿Cómo se ha escapado el león?»`,copies:1,image:`${T}/horror/como-se-ha-escapado-el-leon.webp`,text:`Si no hay Víctimas en el tablero, descarta y roba la siguiente carta de Terror. Si no: todas las Víctimas entran en pánico. Objetivo la Víctima más cercana ▶ mover ▶ atacar. En las Jaulas de los Animales y adyacentes: las Víctimas mueren, los Enemigos reciben 1 de daño y, si estás allí, pierdes 1 Vida.`,requiresVictims:!0,effects:[Ne(`cn-panic-all`),Me(`victim`,1,1),Ne(`cn-lion`)]}],items:[Ie({file:`martillo-de-forzudo`,id:`martillo-de-forzudo`,name:`Martillo de forzudo`,flavor:`«Es hora de demostrarles quién vale y puede jugar a un mega "atrapa-el-topo".»`,text:`Arma: alcance 0, +3 de daño. Debes tener 4 o más de Vida para atacar con él y no puedes llevarlo en la mochila. Después de resolver un ataque con este arma: pierdes 1 Vida y termina tu fase de Acción.`,hands:2,range:[0,0],damage:3,modifies:`any`,custom:`item-hammer`}),Ie({file:`zappo`,id:`zappo`,name:`Zappo, el mono del carnaval`,flavor:`«Qué mono más majo, siempre preparado para echar una mano.»`,text:`Puedes usar a Zappo para jugar una carta de Buscar hasta a 2 espacios de distancia de una zona de Búsqueda. Si usas a Zappo y se revela un Objeto Trampa, huye despavorido: ignora los efectos de la trampa y descarta a Zappo.`,hands:0,custom:`item-zappo`}),Ie({file:`bebida-energetica`,id:`bebida-energetica`,name:`Bebida energética`,flavor:`«Preparada para correr con los toros, cazar un monstruo y fiestear como una estrella de rock.»`,text:`Descártala durante la fase de Acción y elige: +3 Tiempo o muévete 1 zona.`,hands:0,custom:`item-energy-drink`}),Ie({file:`cuchillo`,id:`cuchillo`,name:`Cuchillo`,flavor:`«Nunca antes había estado en una pelea de navajas.»`,text:`Arma: alcance 0, +1 de daño.`,hands:1,range:[0,0],damage:1,modifies:`any`}),Ie({file:`super-dados-de-la-suerte`,id:`super-dados-de-la-suerte`,name:`Super dados de la suerte`,flavor:`«Suerte, sé mi dama esta noche.»`,text:`Úsalos para volver a tirar uno o todos los dados. Después tira un dado: 1-4 descarta esta carta; 5-6 guárdala.`,hands:0,custom:`item-super-lucky-dice`}),Ie({file:`bate-de-aluminio`,id:`bate-de-aluminio`,name:`Bate de aluminio`,flavor:`«Casi como si alguien respodiera las oraciones de estos campeones del softball.»`,text:`Arma: alcance 0, +1 de daño. Siempre que hagas daño al Asesino con el Bate de aluminio, puedes descartar inmediatamente un Poder Oscuro Menor, incluidas las fichas de Vida que le queden.`,hands:2,range:[0,0],damage:1,modifies:`any`,custom:`item-metal-bat`}),Ie({file:`kit-de-primeros-auxilios`,id:`kit-de-primeros-auxilios`,name:`Kit de primeros auxilios`,flavor:`«Calma. Hay que parar la hemorragia. ¡Hoy no vas a morir!»`,text:`Cada vez que uses una carta de Acción para recuperar Vida, recupera 1 más.`,hands:1,custom:`item-first-aid`}),Ie({file:`pertiga`,id:`pertiga-de-10`,name:`Pértiga de 10'`,flavor:`«Nunca fui una estrella del atletismo, pero qué mejor momento para aprender que ahora.»`,text:`Una vez por fase de Acción puedes saltar un espacio al moverte. No se activa ningún efecto del espacio que saltas y ninguna Víctima puede seguirte dentro ni más allá del espacio saltado.`,hands:2,custom:`item-pole`}),Ie({file:`latigo`,id:`latigo`,name:`Látigo`,flavor:`«Igual no es el momento de estar cantando para mí misma sobre azotar algo.»`,text:`Arma: alcance 0, +1 de daño. Si dañas a un Enemigo con el Látigo, puedes moverle 1 espacio.`,hands:1,range:[0,0],damage:1,modifies:`any`,custom:`item-whip`}),Ie({file:`cinta-encontrada`,id:`cinta-encontrada`,name:`Cinta encontrada`,flavor:`«Parece que quien estuvo aquí antes no lo consiguió…»`,text:`Descarta la Cinta encontrada para cancelar los efectos de un Objeto Trampa o de una carta de Trampa de Terror. Si cancelas una carta de Trampa de Terror, descártala sin aplicar NINGUNO de sus efectos.`,hands:0,custom:`item-tape`}),Ie({file:`pildoras-misteriosas`,id:`pildoras-misteriosas`,name:`Píldoras misteriosas`,flavor:`«Espero que calmen mis nervios y sofoquen el dolor.»`,text:`Descártalas durante la fase de Acción y elige: −1 Terror o recupera 2 Vida.`,hands:0,custom:`item-mystery-pills`}),Ie({file:`hacha-arrojadiza`,id:`hacha-arrojadiza`,name:`Hacha arrojadiza`,flavor:`«Les voy a cortar con el hacha para que me dejen en paz.»`,text:`Arma: alcance 0-1, +1 de daño. Puedes usarla para atacar a un Enemigo en un espacio adyacente; si lo haces, descártala después de resolver el ataque.`,hands:1,range:[0,1],damage:1,modifies:`any`,custom:`item-throwing-axe`}),Ie({file:`bola-de-cristal`,id:`bola-de-cristal`,name:`Bola de cristal`,flavor:`«La fortuna favorece a los osados.»`,text:`Una vez por fase de Acción tira un dado. 1-4: no pasa nada. 5-6: mira la siguiente carta de Terror y ponla arriba o debajo del todo del mazo de Terror.`,hands:0,custom:`item-crystal-ball`}),Ie({file:`viejo-revolver`,id:`viejo-revolver`,name:`Viejo revólver`,flavor:`«Espero que aún funcione; tengo que hacer que cada disparo cuente.»`,text:`Arma: alcance 1, +1 de daño. Solo puede modificar la carta de Acción Ataque débil.`,hands:1,range:[1,1],damage:1,modifies:[`ataque-debil`]}),Ie({file:`tapadera`,id:`tapadera`,name:`Tapadera`,flavor:`«No esperaba hacer cosplay de un héroe americano…»`,text:`Ignora 1 punto de daño de un ataque. 3 usos.`,hands:1,uses:3,custom:`item-trash-lid`}),Ie({file:`kit-de-maquillaje`,id:`kit-de-maquillaje`,name:`Kit de maquillaje y disfraz`,flavor:`«¡Sabía que el teatro serviría para algo!»`,text:`Cuando un Enemigo apunte específicamente a la Chica Final, puedes usar el Kit para hacerte pasar por una Víctima: el Enemigo apuntará entonces a la Víctima más cercana.`,hands:0,custom:`item-makeup`}),Ie({file:`bandolera-de-cuchillos`,id:`bandolera-de-cuchillos`,name:`Bandolera de cuchillos`,flavor:`«Creo que son demasiados cuchillos… Nah, no tantos.»`,text:`Arma: alcance 0-1, +1 de daño, 4 usos. Cuando uses la Bandolera de cuchillos, puedes dividir el daño como prefieras entre cualquier Enemigo de su alcance.`,hands:1,range:[0,1],damage:1,uses:4,modifies:`any`,custom:`item-knife-belt`}),Ie({file:`spray-de-pimienta`,id:`spray-de-pimienta`,name:`Spray de pimienta`,flavor:`«Suficientemente fuerte para un oso pardo, ¿suficientemente bueno para un psicópata?»`,text:`Si el Asesino está en tu espacio, puedes descartarlo para terminar inmediatamente la fase del Asesino. Ignora su movimiento restante, sus ataques y demás efectos.`,hands:1,custom:`item-pepper-spray`}),Ie({file:`trampa-para-osos-de-acero`,id:`trampa-para-osos-de-acero`,name:`Trampa para osos de acero`,flavor:`«¡Es una trampa! Una trampa para osos te atrapa mientras buscas.»`,text:`Objeto Trampa. Pierdes 1 Vida. Debes gastar 2 Tiempo para quitarte esta trampa de la pierna y no puedes moverte hasta que lo hagas. Cuando se elimine la trampa, descarta esta carta.`,hands:0,trap:!0}),Ie({file:`trampa-de-gas-somnifero`,id:`trampa-de-gas-somnifero`,name:`Trampa de gas somnífero`,flavor:`«¡Es una trampa! Mientras buscas, gas adormecedor te explota en la cara.»`,text:`Objeto Trampa. ¡Caes dormida! Termina inmediatamente tu fase de Acción y pon el marcador de Tiempo a cero. Recuperas 1 Vida de una buena siesta. Descarta esta carta.`,hands:0,trap:!0}),Ie({file:`trampa-de-la-cobra-oculta`,id:`trampa-de-la-cobra-oculta`,name:`Trampa de la cobra oculta`,flavor:`«¡Es una trampa! ¡Una cobra oculta te ataca!»`,text:`Objeto Trampa. Ponla junto a tu carta de Chica Final. Durante el Mantenimiento pierdes 1 Vida. La próxima vez que recuperes Vida, descarta esta carta en su lugar.`,hands:0,trap:!0})],tokens:{"trampa-acido":`${T}/tokens/trampa-acido.webp`,"trampa-red":`${T}/tokens/trampa-red.webp`,"trampa-sierras":`${T}/tokens/trampa-sierras.webp`,"carro-de-golf":`${T}/tokens/carro-de-golf.webp`,calavera:`${T}/tokens/calavera.webp`},tokenInfo:{"trampa-acido":{text:`Trampa de ácido: toda Víctima que entre o esté aquí muere. Cada vez que tú entres, pierdes 1 Vida. Los Enemigos la ignoran.`,image:`${T}/special/referencia-trampa.webp`},"trampa-red":{text:`Trampa de red de cuerda: toda Víctima que entre o esté aquí muere. Cada vez que tú entres, descartas 1 carta de Acción al azar. Los Enemigos la ignoran.`,image:`${T}/special/referencia-trampa.webp`},"trampa-sierras":{text:`Trampa de sierras giratorias: toda Víctima que entre o esté aquí muere. Cada vez que tú entres, tira 2 dados: con 1-4 recibes 1 de daño; con 5-6 puedes moverte 1 espacio. Los Enemigos la ignoran.`,image:`${T}/special/referencia-trampa.webp`},"carro-de-golf":{text:`Carro de Golf: en el Mantenimiento, tú y/o hasta 2 Víctimas de su espacio podéis conducirlo hasta 2 espacios por el borde del recinto. Si llega a un Enemigo, puedes descartarlo para hacerle 3 de daño.`},calavera:{text:`Calavera: cualquier Víctima en o moviéndose al Bosque de los Horrores es asesinada inmediatamente.`}},specialRules:`Objetos Trampa: hay uno escondido en cada mazo de Objetos; se resuelve al robarlo. Terrores Trampa: 3 cartas de Terror colocan una ficha de Trampa que permanece en el tablero: toda Víctima que entre o esté allí muere y tú sufres su efecto cada vez que entres. Los Enemigos ignoran las fichas de Trampa.`},Re=`assets/final-girls`,ze={id:`asami`,name:`Asami`,health:5,film:`carnival`,image:`${Re}/asami.webp`,ultimateImage:`${Re}/asami-ultimate.webp`,token:`${Re}/asami-token.webp`,rescueSlots:[{effects:[{kind:`takeActionCard`,cardId:`buscar`}],text:`Coge una carta de Acción Buscar`},{effects:[{kind:`heal`,amount:1}],text:`Recupera 1 Vida`},{effects:[{kind:`move`,upTo:1}],text:`Muévete 1 zona`},{effects:[{kind:`terror`,amount:-2}],text:`−2 Terror`}],ultimate:{text:`Cada vez que robas al menos una carta de Objeto, roba una adicional y escoge una. Eres inmune a las cartas de Objeto Trampa.`,custom:`ult-asami`},extraRescueReward:[{kind:`heal`,amount:1}],extraRescueText:`Recupera 1 Vida`,bonusItem:`cinturon-de-cuchillos-de-asami`},Be={id:`charlie`,name:`Charlie`,health:7,film:`carnival`,image:`${Re}/charlie.webp`,ultimateImage:`${Re}/charlie-ultimate.webp`,token:`${Re}/charlie-token.webp`,rescueSlots:[{effects:[{kind:`terror`,amount:-1}],text:`−1 Terror`},{effects:[{kind:`move`,upTo:1}],text:`Muévete 1 zona`},{effects:[{kind:`move`,upTo:1}],text:`Muévete 1 zona`},{effects:[{kind:`time`,amount:2}],text:`+2 Tiempo`},{effects:[{kind:`terror`,amount:-1}],text:`−1 Terror`},{effects:[{kind:`terror`,amount:-1}],text:`−1 Terror`}],ultimate:{text:`Durante la fase de Acción, puedes perder 3 Vida para poner la carta de Acción Golpe crítico directamente en tu mano.`,custom:`ult-charlie`},extraRescueReward:[{kind:`time`,amount:1}],extraRescueText:`+1 Tiempo`,bonusItem:`martillo-gigante-de-charlie`},Ve=[{id:`cinturon-de-cuchillos-de-asami`,name:`Cinturón de cuchillos de Asami`,image:`${Re}/bonus-items/cinturon-de-cuchillos-de-asami.webp`,flavor:`«Me siento como un puercoespín con todo esto.»`,text:`Solo Asami puede usar este objeto. Arma: alcance 0-1, +1 de daño. Cuando lo uses, puedes dividir el daño como prefieras entre cualquier Enemigo dentro de su alcance.`,hands:1,range:[0,1],damage:1,modifies:`any`,onlyFor:`asami`,custom:`item-knife-belt`},{id:`martillo-gigante-de-charlie`,name:`Martillo gigante de Charlie`,image:`${Re}/bonus-items/martillo-gigante-de-charlie.webp`,flavor:`«Justo como practicaba en cross fit, pero con un neumático en movimiento.»`,text:`Solo Charlie puede usar este objeto. Arma: alcance 0, +3 de daño. Debes tener 2 o más de Vida para atacar con él. Después de resolver un ataque con este arma: pierdes 1 Vida y termina tu fase de Acción.`,hands:2,range:[0,0],damage:3,modifies:`any`,onlyFor:`charlie`,custom:`item-hammer-charlie`}],D=`assets/killers/geppetto`,He=(e,t,n,r={})=>({kind:`killerAction`,action:{target:e,moves:t,attacks:n,...r.actor?{actor:r.actor}:{},...r.per?{perVictimKilled:r.per}:{},...r.attackFirst?{attackFirst:!0}:{}}}),Ue=e=>({kind:`custom`,id:e}),We=e=>({kind:`terror`,amount:e}),Ge=(e,t,n=[],r=!1)=>({attack:e,move:t,effects:n,...r?{revealDarkPower:r}:{}}),Ke={kind:`drawEvent`},qe={id:`carnival`,name:`Matanza en la Feria`,killer:{id:`geppetto`,name:`Geppetto`,film:`carnival`,icon:`tophat`,board:`${D}/board.webp`,cover:`${D}/cover.webp`,token:`${D}/token.webp`,select:`${D}/select.webp`,startTerror:4,health:8,bloodlust:[Ge(1,1),Ge(1,1),Ge(1,1),Ge(1,2,[],!0),Ge(1,2),Ge(2,2),Ge(2,3,[Ke]),Ge(2,3),Ge(2,3,[Ke])],bloodlustMaxEffect:[Ue(`discard-next-horror`)],bloodlustMaxText:`se descarta la siguiente carta de Horror`,minion:{name:`Marioneta`,plural:`Marionetas`,count:3,health:1,attack:1,tokens:[`${D}/minions/marioneta-1.webp`,`${D}/minions/marioneta-2.webp`,`${D}/minions/marioneta-3.webp`],reference:`${D}/special/marionetas.webp`,text:`Esbirros (3 en total). Tienen 1 Vida, Ataque 1 y el Movimiento de Geppetto. Deben terminar su movimiento a menos de 2 espacios de Geppetto. Hasta el Gran Final, cada fase del Asesino aparece una Marioneta de la casilla Listo; las destruidas vuelven a Listo en la siguiente.`},initialMinionAction:[Ue(`minion-spawn`),He(`victim`,1,0,{actor:`minions`})],initialAction:[He(`nearest`,0,1,{actor:`killer`})],finaleBack:`${D}/finale/back.webp`,darkPowerBack:`${D}/dark-power/back.webp`,finales:[{id:`hice-a-tus-amigos`,name:`Hice a tus amigos`,image:`${D}/finale/hice-a-tus-amigos.webp`,minionAction:[He(`finalGirl`,1,1,{actor:`minions`})],finalAction:[He(`finalGirl`,1,1,{actor:`killer`})],text:`Durante la fase del Asesino, las Víctimas actúan como Marionetas (resuelven la acción de Esbirro); el resto del tiempo son Víctimas normales. Puedes atacar y matar Víctimas si quieres (sube la Sed de Sangre).`,custom:`finale-friends`},{id:`sin-ataduras`,name:`Sin ataduras`,image:`${D}/finale/sin-ataduras.webp`,minionAction:[He(`nearest`,1,1,{actor:`minions`})],finalAction:[He(`nearest`,2,1,{actor:`killer`})],text:`Los movimientos de las Marionetas ya no están atados a Geppetto: pueden moverse por todas partes. Cuando se muevan, pueden moverse 1 espacio adicional.`,custom:`finale-unbound`},{id:`les-recuerdas`,name:`¿Les recuerdas?`,image:`${D}/finale/les-recuerdas.webp`,minionAction:[He(`nearest`,1,1,{actor:`minions`})],finalAction:[He(`finalGirl`,1,2,{actor:`killer`})],text:`Cuando se revele, coloca todas las Marionetas restantes en el tablero. Cuando se muevan las Marionetas, se mueven 1 espacio menos de lo normal.`,custom:`finale-remember`}],darkPowers:[{id:`abominacion-masiva`,name:`Abominación masiva`,image:`${D}/dark-power/abominacion-masiva.webp`,text:`Cada Marioneta ignora el primer daño que recibe cada turno.`,custom:`dp-massive-abomination`},{id:`injerto-de-armas`,name:`Injerto de armas`,image:`${D}/dark-power/injerto-de-armas.webp`,text:`Las Marionetas ahora hacen 2 de daño al atacar.`,custom:`dp-weapon-graft`},{id:`maestro-inmortal`,name:`Maestro inmortal`,image:`${D}/dark-power/maestro-inmortal.webp`,text:`Si todas las Marionetas están en el tablero, Geppetto no puede morir. Cualquier daño que pudiera retirar su ficha de Vida Final se ignora.`,custom:`dp-immortal-master`},{id:`unete-a-la-familia`,name:`Únete a la familia`,image:`${D}/dark-power/unete-a-la-familia.webp`,text:`Poder Oscuro Épico. Durante la fase del Asesino, si las 3 Marionetas están en tu espacio, pierdes toda la Vida restante. Todavía resuelves tu ficha de Vida Final de forma normal.`,epic:!0,custom:`dp-join-family`}],horror:[{id:`loca-risa-interminable`,name:`Loca risa interminable`,copies:1,image:`${D}/horror/loca-risa-interminable.webp`,text:`Todas las Víctimas de tu espacio y de los adyacentes entran en pánico. Las Víctimas en un espacio con un Enemigo son asesinadas. Si estás con o adyacente a Geppetto, pierdes Vida igual a su Valor de Ataque. Si ninguna Víctima fue asesinada y no sufriste daño, resuelve la siguiente carta de Terror.`,effects:[Ue(`cn-loca-risa`)]},{id:`piezas-de-repuesto`,name:`Piezas de repuesto`,copies:1,image:`${D}/horror/piezas-de-repuesto.webp`,text:`Coloca 2 nuevas Víctimas en el punto de partida de Geppetto. Luego coloca a Geppetto en el espacio de la Víctima más cercana. Objetivo el más cercano ▶ atacar. Por cada Víctima que muera: +1 Sed de Sangre y Geppetto recupera 1 Vida.`,effects:[{kind:`placeVictims`,count:2,where:{at:`killerStart`}},Ue(`cn-spare-parts`),He(`nearest`,0,1,{per:[{kind:`bloodlust`,amount:1},{kind:`killerHeal`,amount:1}]})]},{id:`seras-un-divertido-nuevo-juguete`,name:`«Serás un divertido nuevo juguete…»`,copies:1,image:`${D}/horror/seras-un-divertido-nuevo-juguete.webp`,text:`+2 Terror. Objetivo el más cercano ▶ mover ▶ atacar.`,effects:[We(2),He(`nearest`,1,1)]},{id:`encerrado-y-sin-lugar-donde-ir`,name:`Encerrado y sin lugar donde ir`,copies:1,image:`${D}/horror/encerrado-y-sin-lugar-donde-ir.webp`,text:`Si no hay Víctimas en el tablero, descarta y roba la siguiente carta de Terror. Si no: +2 Terror. Cada Víctima que está con o adyacente al espacio de una Marioneta entra en pánico. Si una Víctima entra en pánico a un espacio con una Marioneta, muere inmediatamente.`,requiresVictims:!0,effects:[We(2),Ue(`cn-trapped`)]},{id:`hacer-o-romper`,name:`Hacer o romper`,copies:1,image:`${D}/horror/hacer-o-romper.webp`,text:`Tira un dado. Debes perder Vida igual a la mitad del resultado (redondeando hacia arriba) o, en su lugar, mueren ese mismo número de Víctimas.`,effects:[Ue(`cn-do-or-die`)]},{id:`no-hay-salida`,name:`No hay salida`,copies:1,image:`${D}/horror/no-hay-salida.webp`,text:`+1 Terror. Coloca a Geppetto y a cada Marioneta en un espacio de Salida (distribuye con igualdad). Objetivo el más cercano ▶ mover ▶ atacar.`,effects:[We(1),Ue(`cn-no-exit`),He(`nearest`,1,1)]},{id:`traedmela`,name:`«¡Traédmela!»`,copies:1,image:`${D}/horror/traedmela.webp`,text:`La Marioneta más cercana a ti: objetivo la Chica Final ▶ mover ▶ atacar. Si has recibido daño de la Marioneta, te mueven 1 espacio más hacia Geppetto. Si estás en el espacio de Geppetto o no hay Marionetas en tu espacio, descarta esta carta. Si no, resuélvela de nuevo desde el inicio.`,effects:[Ue(`cn-bring-her`)]},{id:`showman-maestro`,name:`Showman maestro`,copies:1,image:`${D}/horror/showman-maestro.webp`,text:`Coloca a Geppetto en tu espacio. Pon una Marioneta en cada espacio adyacente si es posible. Objetivo el más cercano ▶ atacar.`,effects:[Ue(`cn-showman`),He(`nearest`,0,1)]},{id:`nos-tienen-completamente-rodeados`,name:`«¡Nos tienen completamente rodeados!»`,copies:1,image:`${D}/horror/nos-tienen-completamente-rodeados.webp`,text:`Si no hay Víctimas en el tablero, descarta y roba la siguiente carta de Terror. Si no: +1 Terror. Objetivo la Víctima más cercana ▶ mover ▶ atacar.`,requiresVictims:!0,effects:[We(1),He(`victim`,1,1)]},{id:`baila-muneco`,name:`«¡Baila muñeco!»`,copies:1,image:`${D}/horror/baila-muneco.webp`,text:`Haz una Tirada de Terror. Con éxito: mueve todas las Marionetas 1 espacio hacia ti o hacia la Víctima más cercana (eliges). Sin éxito: mata a una Víctima en tu espacio; si no hay, +2 Terror.`,effects:[Ue(`cn-dance`)]},{id:`vienen-por-todas-partes`,name:`«¡Vienen por todas partes!»`,copies:1,image:`${D}/horror/vienen-por-todas-partes.webp`,text:`Tira un dado. Si el resultado es menor que el nivel de Horror, las Marionetas que quedan (da igual su estado) aparecen en el espacio de Geppetto. Las Marionetas sólo: objetivo la Chica Final ▶ mover ▶ mover ▶ atacar.`,effects:[Ue(`cn-everywhere`),He(`finalGirl`,2,1,{actor:`minions`})]},{id:`cielo-santo-esos-son-nuestros-amigos`,name:`«¡Cielo santo! ¿Esos son nuestros amigos?»`,copies:1,image:`${D}/horror/cielo-santo-esos-son-nuestros-amigos.webp`,text:`Objetivo el más cercano ▶ mover ▶ atacar. Tira un dado por cada Víctima con o adyacente a una Marioneta: 1-5 mueve la Víctima hacia la Marioneta; 6 mueve la Víctima 1 espacio en cualquier dirección. Después: objetivo el más cercano ▶ atacar.`,effects:[He(`nearest`,1,1),Ue(`cn-friends`),He(`nearest`,0,1)]},{id:`cuerdas-cuchilla-de-marioneta`,name:`Cuerdas cuchilla de Marioneta`,copies:1,image:`${D}/horror/cuerdas-cuchilla-de-marioneta.webp`,text:`Las Víctimas con o adyacentes a Geppetto son asesinadas. Pierdes 2 Vida si estás con o adyacente a Geppetto (puedes reducir el daño en 1 por cada carta de Caminar o Correr que descartes). Si ninguna Víctima murió y no recibiste daño, resuelve la siguiente carta de Terror.`,effects:[Ue(`cn-blades`)]},{id:`me-estan-ganando`,name:`«¡Me están ganando!»`,copies:1,image:`${D}/horror/me-estan-ganando.webp`,text:`Tira un dado. Si el resultado es menor que el nivel de Horror, pierdes Tiempo igual al nivel de Horror. Las Marionetas sólo: objetivo la Chica Final ▶ mover.`,effects:[Ue(`cn-winning`),He(`finalGirl`,1,0,{actor:`minions`})]},{id:`soy-una-marioneta`,name:`«¿Soy una marioneta?»`,copies:1,image:`${D}/horror/soy-una-marioneta.webp`,text:`Poder Oscuro Menor (2 Vidas). Si comienzas tu turno a más de 2 espacios de Geppetto, pierdes Vida igual a su Valor de Ataque actual.`,effects:[],minorDarkPower:{health:2,custom:`mdp-am-i-puppet`}},{id:`marionetas-por-doquier`,name:`Marionetas por doquier`,copies:1,image:`${D}/horror/marionetas-por-doquier.webp`,text:`Poder Oscuro Menor (2 Vidas). Cada vez que una Víctima es asesinada en tu espacio o en uno adyacente, +1 Terror.`,effects:[],minorDarkPower:{health:2,custom:`mdp-puppets-everywhere`}}],specialRules:`Marionetas (Esbirros): 3 fichas con 1 Vida y Ataque 1; su Movimiento es el de Geppetto. Los Esbirros siempre actúan antes que el Asesino. Deben terminar su movimiento a menos de 2 espacios de Geppetto.`},location:Le,finalGirls:[ze,Be],bonusItems:Ve},O=`assets/locations/creech-manor`,Je=1800,Ye=1590,Xe=(e,t,n,r={})=>({kind:`killerAction`,action:{target:e,moves:t,attacks:n,...r.killAlong?{killAlong:!0}:{}}}),Ze=e=>({kind:`custom`,id:e}),k=(...e)=>e,Qe=(e,t)=>({x:e/Je*100,y:t/Ye*100}),$e=[{id:`atico`,name:`Ático`,label:`Ático`,search:!0,floor:5,pos:Qe(800,430),flee:[{to:`cuarto-escalera`,faces:k(5,6)}]},{id:`cuarto-tele`,label:`Cuarto de la tele`,floor:4,pos:Qe(500,620),flee:[{to:`cuarto-escalera`,faces:k(3,4,5,6)},{to:`lavabo-izq`,faces:k(1,2)}]},{id:`cuarto-escalera`,label:`Cuarto de la escalera`,floor:4,pos:Qe(800,610),flee:[{to:`cuarto-tele`,faces:k(1)},{to:`dormitorio`,faces:k(2)},{to:`atico`,faces:k(3,4,5,6)}]},{id:`dormitorio`,label:`Dormitorio`,floor:4,pos:Qe(1060,610),flee:[{to:`pasillo-escalera`,faces:k(1)},{to:`cuarto-escalera`,faces:k(2,3,4)},{to:`vestidor`,faces:k(5,6)}]},{id:`vestidor`,name:`Vestidor`,label:`Vestidor`,search:!0,floor:4, nalGirl:`atico`,killer:`lavabo-izq`,victims:{"cuarto-escalera":2,vestidor:2,despacho:1,"dormitorio-largo":1,rellano:1,"cuarto-cortinas":1,"salon-baile":2}},{id:`creepshow`,name:`Creepshow`,image:`${O}/setup/creepshow.webp`,finalGirl:`ext-centro`,killer:`vestidor`,victims:{atico:3,"cuarto-tele":1,"cuarto-escalera":1,despacho:1,"lavabo-der":1,garaje:1,"salon-baile":2}}],eventBack:`${O}/events/back.webp`,events:[{id:`rescate-en-helicoptero`,name:`Rescate en helicóptero`,image:`${O}/events/rescate-en-helicoptero.webp`,flavor:`«¡¡Estamos salvados!!»`,text:`Pon la ficha del Helicóptero en el tejado de la casa. Una vez durante la partida puedes moverte del Ático al Helicóptero, ya que están adyacentes. Cualquier Víctima (o Carolyn) que esté contigo puede ser salvada. A menos que hayas salvado a Carolyn, debes volver al Ático y quitar la ficha. El Helicóptero no se considera una zona de Salida. Descarta esta carta cuando la ficha del Helicóptero ya no juegue.`,token:`helicoptero`,onReveal:[],persistent:!0,custom:`ev-helicopter`},{id:`nadie-vuelve`,name:`Nadie vuelve`,image:`${O}/events/nadie-vuelve.webp`,flavor:`«Lo que sube, no baja»`,text:`Pon la ficha de la Calavera en el Ático. Todas las Víctimas que estén en el Ático mueren. Cada vez que una Víctima entre en el Ático muere inmediatamente.`,token:`calavera`,onReveal:[],persistent:!0,custom:`ev-nobody-returns`},{id:`cazadores-de-fantasmas`,name:`Cazadores de fantasmas`,image:`${O}/events/cazadores-de-fantasmas.webp`,flavor:`«¡Los niveles de EMF están desbordados… ¡Bingo!»`,text:`Cambia las 3 Víctimas más cercanas a ti (o todas las posibles) por Víctimas Especiales. Estas Víctimas no te seguirán hasta que una de ellas muera. Cada vez que una de estas Víctimas muera, +1 Sed de Sangre. Descarta esta carta cuando la última Víctima Especial ya no juegue.`,onReveal:[],persistent:!0,custom:`ev-ghost-hunters`},{id:`congelado-por-el-miedo`,name:`Congelado por el miedo`,image:`${O}/events/congelado-por-el-miedo.webp`,flavor:`«Lo único que podía mover eran mis globos oculares. ¡Era terrorífico!»`,text:`Las Víctimas ya no sufren pánico durante la fase de Huida.`,onReveal:[],persistent:!0,custom:`ev-frozen-fear`},{id:`no-tengo-miedo-de-ningun-fantasma`,name:`No tengo miedo de ningún fantasma`,image:`${O}/events/no-tengo-miedo-de-ningun-fantasma.webp`,flavor:`«Viene de ahí arriba. ¡Vamos a comprobarlo!»`,text:`Mueve cada Víctima un espacio hacia el Ático. Descarta esta carta.`,onReveal:[Ze(`cm-toward-attic`)],persistent:!1},{id:`empujados-hasta-el-borde`,name:`Empujados hasta el borde`,image:`${O}/events/empujados-hasta-el-borde.webp`,flavor:`«Me miraron sobriamente. Entonces, sin decir nada, caminaron hacia la ventana… y saltaron.»`,text:`Tira un dado por cada Víctima en un espacio con ventana. Si la tirada sale mal (1-4), esa Víctima salta y muere. Descarta esta carta.`,onReveal:[Ze(`cm-pushed`)],persistent:!1},{id:`fuera-luces`,name:`Fuera luces`,image:`${O}/events/fuera-luces.webp`,flavor:`«¿Quién apagó las luces? ¿Qué fue eso?»`,text:`Tira 1 dado menos (mínimo 1) cuando resuelvas una carta de Acción que permita movimiento. Ignora este efecto si tienes la Linterna o la Vela.`,onReveal:[],persistent:!0,custom:`ev-lights-out`},{id:`victimas-pegajosas`,name:`Víctimas pegajosas`,image:`${O}/events/victimas-pegajosas.webp`,flavor:`«¡No me dejes!»`,text:`Debes tener al menos 1 Víctima siguiéndote, si es posible.`,onReveal:[],persistent:!0,custom:`ev-clingy-victims`},{id:`coraje-liquido`,name:`Coraje líquido`,image:`${O}/events/coraje-liquido.webp`,flavor:`«¿De qué estabas hablando… que eso es un fantasma? Muesstrámelo.»`,text:`Las Víctimas te seguirán a la zona del Asesino.`,onReveal:[],persistent:!0,custom:`ev-liquid-courage`},{id:`la-curiosidad-mato-a-la-gente`,name:`La curiosidad mató a la gente`,image:`${O}/events/la-curiosidad-mato-a-la-gente.webp`,flavor:`«¡Hemos oído que este sitio está embrujado!»`,text:`Pon 3 nuevas Víctimas en el Vestíbulo y ponlas en modo pánico inmediatamente. Descarta esta carta.`,onReveal:[{kind:`placeVictims`,count:3,where:{zone:`vestibulo`}},Ze(`cm-panic-vestibule`)],persistent:!1}],horror:[{id:`es-falso`,name:`«¡Es falso!»`,copies:1,image:`${O}/horror/es-falso.webp`,text:`Descarta un Objeto aleatoriamente. Si no tienes Objetos, descarta y roba la siguiente carta de Terror. Objetivo el más cercano ▶ mover ▶ atacar.`,effects:[Ze(`cm-fake`),Xe(`nearest`,1,1)]},{id:`algo-viene-a-traves-de-la-pared`,name:`«¡Algo viene a través de la pared!»`,copies:1,image:`${O}/horror/algo-viene-a-traves-de-la-pared.webp`,text:`Si no hay Víctimas en el tablero, descarta y roba la siguiente carta de Terror. Si no: todas las Víctimas entran en pánico; cualquier Víctima que salte por una ventana muere. Roba un Evento.`,requiresVictims:!0,effects:[Ze(`cm-wall`),{kind:`drawEvent`}]},{id:`ventanas-y-puertas-cerradas`,name:`«¡Las ventanas y las puertas se han cerrado de golpe!»`,copies:1,image:`${O}/horror/ventanas-y-puertas-cerradas.webp`,text:`Si estás dentro, no puedes moverte durante la siguiente fase de Acción. Si estás fuera, no puedes entrar en la casa durante la siguiente fase de Acción. Roba un Evento.`,effects:[Ze(`cm-doors`),{kind:`drawEvent`}]},{id:`esta-rota`,name:`«¡Está rota!»`,copies:1,image:`${O}/horror/esta-rota.webp`,text:`Pon la ficha de Escalera Rota cubriendo la escalera del tablero. La escalera ya no se puede usar y los espacios conectados a ella ya no se consideran adyacentes. +1 Terror.`,effects:[Ze(`cm-broken-ladder`),{kind:`terror`,amount:1}]},{id:`algo-impio-paso`,name:`«Algo impío pasó en el…»`,copies:1,image:`${O}/horror/algo-impio-paso.webp`,text:`Tira un dado y coloca al Asesino en esa habitación: 1-2 Ático, 3-4 Vestidor, 5-6 Salón de Baile. Objetivo el más cercano ▶ atacar. Después: objetivo el más cercano ▶ mover ▶ atacar.`,effects:[Ze(`cm-unholy`),Xe(`nearest`,0,1),Xe(`nearest`,1,1)]},{id:`voces-oigo-voces`,name:`«¡Voces… oigo voces!»`,copies:1,image:`${O}/horror/voces-oigo-voces.webp`,text:`Si no hay Víctimas en el tablero, descarta y roba la siguiente carta de Terror. Si no: todas las Víctimas suben al siguiente piso. +1 Terror. Objetivo la Víctima más cercana ▶ mover ▶ atacar.`,requiresVictims:!0,effects:[Ze(`cm-voices`),{kind:`terror`,amount:1},Xe(`victim`,1,1)]},{id:`que-viene-que-viene`,name:`«¡Que viene, que viene!»`,copies:1,image:`${O}/horror/que-viene-que-viene.webp`,text:`Objetivo la Víctima más cercana ▶ mover ×3. Mata a una Víctima en cada espacio por el que pase el Asesino, incluidos su espacio inicial y final.`,effects:[Xe(`victim`,3,0,{killAlong:!0})]},{id:`los-arboles-estan-vivos`,name:`«¡Los árboles están vivos!»`,copies:1,image:`${O}/horror/los-arboles-estan-vivos.webp`,text:`Si estás en un espacio con ventana, pierdes 1 Vida. Las Víctimas en espacios con ventana mueren. Si al menos una Víctima muere, +1 Terror. Roba un Evento.`,effects:[Ze(`cm-trees`),{kind:`drawEvent`}]}],items:[et({file:`dado-de-la-suerte`,id:`dado-de-la-suerte`,name:`Dado de la suerte`,flavor:`«Prefiero ser afortunada que buena.»`,text:`Descarta para volver a tirar alguno o todos tus dados.`,hands:0,custom:`item-lucky-dice`}),et({file:`candado`,id:`candado`,name:`Candado`,flavor:`«¿Para guardar algo dentro… o fuera?»`,text:`Coloca la ficha del Candado entre dos habitaciones. Solo tú y las Víctimas que te acompañen podéis cruzar el Candado. Si un Enemigo te ataca en una habitación adyacente al Candado, ignora el ataque y quita la ficha en su lugar.`,hands:0,custom:`item-padlock`,token:`candado`}),et({file:`lista-de-cosas`,id:`lista-de-cosas`,name:`Una lista de cosas en el…`,flavor:`«La pregunta es: ¿esto me ayudará?»`,text:`Al conseguirla, tira un dado inmediatamente: 1-2 Garaje, 3-4 Vestidor, 5-6 Ático. Revela todas las cartas de Objeto de ese mazo manteniendo el orden. Después, descarta esta carta.`,hands:0,custom:`item-list`}),et({file:`kit-de-primeros-auxilios`,id:`kit-de-primeros-auxilios`,name:`Kit de primeros auxilios`,flavor:`«¡Tengo que ponerme estas vendas si quiero sobrevivir!»`,text:`Cada vez que uses una carta de Acción para recuperar Vida, recupera 1 más.`,hands:1,custom:`item-first-aid`}),et({file:`pata-de-conejo`,id:`pata-de-conejo`,name:`Pata de conejo de la suerte`,flavor:`«¿Cómo funciona esto?»`,text:`Descártala durante la fase de Acción para hacer una Tirada de Terror. Por cada éxito elige una opción: +2 Tiempo, recupera 1 Vida, −1 Terror o muévete 1 zona.`,hands:0,custom:`item-rabbit-foot`}),et({file:`daga-ritual`,id:`daga-ritual`,name:`Daga ritual`,flavor:`«Casi puedo sentir el mal.»`,text:`Arma: alcance 0, +1 de daño. Puedes descartarla para matar a una Víctima de tu zona (sube la Sed de Sangre como siempre). Si lo haces, retira todos los Poderes Oscuros Menores o haz 1 de daño al Asesino.`,hands:1,range:[0,0],damage:1,modifies:`any`,custom:`item-ritual-dagger`}),et({file:`texto-antiguo`,id:`texto-antiguo`,name:`Texto antigüo`,flavor:`«¿Hay respuestas dentro?»`,text:`Una vez por fase de Acción puedes perder 1 Vida para ganar 2 Tiempo.`,hands:0,custom:`item-ancient-text`}),et({file:`linterna`,id:`linterna`,name:`Linterna`,flavor:`«Espero que estas baterías duren…»`,text:`Una vez por fase de Acción, por 1 Tiempo, puedes mirar la carta superior del mazo de Terror. Déjala ahí o ponla debajo, al fondo del mazo.`,hands:0,custom:`item-flashlight`}),et({file:`mapa`,id:`mapa`,name:`Mapa`,flavor:`«Parecen unas breves instrucciones para una compañía de transporte.»`,text:`Descártalo durante la fase de Acción y, por cada mazo de Objetos: si la carta superior está bocabajo, puedes ponerla bocarriba; si está bocarriba, puedes retirarla del juego y poner la siguiente bocarriba.`,hands:0,custom:`item-map`}),et({file:`escalera-de-cuerda`,id:`escalera-de-cuerda`,name:`Escalera de cuerda`,flavor:`«Puede que sea mi única salida de aquí…»`,text:`Descarta esta carta para quitar la ficha de Escalera Rota, O para poner la ficha de Escalera de Cuerda en una habitación con una flecha de movimiento de un solo sentido: el movimiento es ahora de doble sentido desde y hacia ese espacio.`,hands:0,custom:`item-rope-ladder`,token:`escalera-de-cuerda`}),et({file:`vela`,id:`vela`,name:`Vela`,flavor:`«Llámame Ebenezer Scrooge.»`,text:`Una vez por fase de Acción puedes mover una Víctima de un espacio adyacente a tu espacio.`,hands:0,custom:`item-candle`}),et({file:`cuchillo`,id:`cuchillo`,name:`Cuchillo`,flavor:`«Puede ser útil… mientras sangra…»`,text:`Arma: alcance 0, +1 de daño.`,hands:1,range:[0,0],damage:1,modifies:`any`}),et({file:`pildoras-misteriosas`,id:`pildoras-misteriosas`,name:`Píldoras misteriosas`,flavor:`«Pueden hacerme alucinar, pero ¿qué alucinación puede ser peor que esta?»`,text:`Descártalas durante la fase de Acción y elige: −1 Terror o recupera 2 Vida.`,hands:0,custom:`item-mystery-pills`}),et({file:`rifle`,id:`rifle`,name:`Rifle`,flavor:`«¡Sí! Ahora ESTO es un arma.»`,text:`El Rifle no puede modificar una carta de Acción y se usa sin ella. Una vez por turno puedes descartar 2 cartas de tu mano y tirar 6 dados: haz 1 de daño a cada Enemigo de tu espacio por cada éxito. Si al menos la mitad de los dados salen en blanco, descarta el Rifle.`,hands:2,custom:`item-rifle`}),et({file:`crucifijo`,id:`crucifijo`,name:`Crucifijo`,flavor:`«Padre Nuestro que estás en el cielo…»`,text:`Descártalo para ignorar una carta de Terror.`,hands:0,custom:`item-crucifix`}),et({file:`viejo-revolver`,id:`viejo-revolver`,name:`Viejo revólver`,flavor:`«Casa vieja. Viejo revólver. Claro.»`,text:`Arma: alcance 1, +1 de daño. Solo puede modificar la carta de Acción Ataque débil.`,hands:1,range:[1,1],damage:1,modifies:[`ataque-debil`]}),et({file:`tapadera`,id:`tapadera`,name:`Tapadera`,flavor:`«Puede que me proteja, si no me mata antes el olor.»`,text:`Ignora 1 punto de daño de un ataque. 3 usos.`,hands:1,uses:3,custom:`item-trash-lid`}),et({file:`bebida-energetica`,id:`bebida-energetica`,name:`Bebida energética`,flavor:`«¿Energía fabricada? ¡Qué demonios!»`,text:`Descártala durante la fase de Acción y elige: +3 Tiempo o muévete 1 zona.`,hands:0,custom:`item-energy-drink`})],tokens:{helicoptero:`${O}/tokens/helicoptero.webp`,calavera:`${O}/tokens/calavera.webp`,"escalera-rota":`${O}/tokens/escalera-rota.webp`,"escalera-de-cuerda":`${O}/tokens/escalera-de-cuerda.webp`,candado:`${O}/tokens/candado.webp`},tokenInfo:{helicoptero:{text:`Helicóptero: una vez puedes moverte del Ático al tejado; las Víctimas (o Carolyn) que estén contigo se salvan. Si no salvas a Carolyn, vuelves al Ático.`},calavera:{text:`Calavera: toda Víctima que esté o entre en el Ático muere inmediatamente.`},"escalera-rota":{text:`Escalera Rota: la escalera exterior ya no se puede usar y sus espacios dejan de ser adyacentes.`},"escalera-de-cuerda":{text:`Escalera de Cuerda: la unión de un solo sentido de este espacio pasa a ser de doble sentido.`},candado:{text:`Candado: solo tú y las Víctimas que te acompañen podéis cruzar esta unión. Si un Enemigo te ataca junto a él, se anula el ataque y se quita.`}},specialRules:`Movimiento en un sentido: tres uniones tienen una flecha y solo se cruzan en ese sentido (siguen siendo adyacentes). Espacios con ventana: 3. Exteriores: los 3 espacios verdes (todos son de Salida). La Escalera es la exterior que une el Exterior izquierdo con el Lavabo de la izquierda.`},nt=`assets/final-girls`,rt={id:`alice`,name:`Alice`,health:4,film:`creech`,image:`${nt}/alice.webp`,ultimateImage:`${nt}/alice-ultimate.webp`,token:`${nt}/alice-token.webp`,rescueSlots:[{effects:[{kind:`time`,amount:2}],text:`+2 Tiempo`},{effects:[{kind:`heal`,amount:1}],text:`Recupera 1 Vida`},{effects:[{kind:`heal`,amount:1}],text:`Recupera 1 Vida`},{effects:[{kind:`takeActionCard`,maxCost:2}],text:`Coge una carta de Acción de coste 2 o menos`},{effects:[{kind:`move`,upTo:2}],text:`Muévete hasta 2 zonas`},{effects:[{kind:`move`,upTo:1}],text:`Muévete 1 zona`}],ultimate:{text:`Escoge un tipo de carta de Acción. El resto de la partida, cada vez que juegues ese tipo de carta, tira siempre exactamente 5 dados, sin importar el nivel de ronto-estara-perdida`,name:`Pronto estará perdida`,image:`${ot}/finale/pronto-estara-perdida.webp`,finalAction:[lt(`pg-lost-draw`)],text:`Roba una carta de Terror cada fase del Asesino; si no puedes, pierdes la partida inmediatamente. Se añaden 3 cartas al mazo de Terror al revelarse.`,custom:`finale-lost`}],darkPowers:[{id:`eterna-desesperacion`,name:`Eterna desesperación`,image:`${ot}/dark-power/eterna-desesperacion.webp`,text:`Cada vez que resuelvas una Tirada de Terror, pierdes 1 de Tiempo por cada dado que muestre un 1 (después de volver a tirar).`,custom:`dp-eternal-despair`},{id:`barrera-invisible`,name:`Barrera invisible`,image:`${ot}/dark-power/barrera-invisible.webp`,text:`No puedes entrar en una zona de Salida con Carolyn a menos que tengas toda tu Vida.`,custom:`dp-invisible-barrier`},{id:`rafaga-de-viento`,name:`Ráfaga de viento`,image:`${ot}/dark-power/rafaga-de-viento.webp`,text:`Todos tus movimientos de 2 o más espacios se reducen en 1 espacio.`,custom:`dp-wind-gust`},{id:`olvidando-algo`,name:`¿Olvidando algo?`,image:`${ot}/dark-power/olvidando-algo.webp`,text:`Poder Oscuro Épico. No puedes ganar la partida a menos que llegues a una zona de Salida con Carolyn y con la carta de Objeto de Mr. Floppy.`,epic:!0,custom:`dp-forgot-something`}],horror:[{id:`carolyn-donde-estas`,name:`«¿Carolyn, dónde estás?»`,copies:2,image:`${ot}/horror/carolyn-donde-estas.webp`,text:`Si Carolyn no está contigo, descarta y roba la siguiente carta de Terror. Si no: baraja a Carolyn en el mazo de Objetos de la zona de Búsqueda más cercana. NO reveles la carta superior de ese mazo.`,skipIf:`noCarolyn`,effects:[lt(`pg-carolyn`)]},{id:`las-sombras-se-acercan`,name:`«Las sombras se acercan»`,copies:2,image:`${ot}/horror/las-sombras-se-acercan.webp`,text:`Si no hay Víctimas en el tablero, descarta y roba la siguiente carta de Terror. Si no: +2 Terror. Objetivo la Víctima más cercana ▶ mover ▶ atacar.`,requiresVictims:!0,effects:[ut(2),ct(`victim`,1,1)]},{id:`todo-alrededor-estaba-volando`,name:`«¡Todo alrededor estaba volando!»`,copies:2,image:`${ot}/horror/todo-alrededor-estaba-volando.webp`,text:`Coloca al Poltergeist con la Víctima más cercana, o en tu espacio si no hay Víctimas. Objetivo el más cercano ▶ atacar.`,effects:[lt(`pg-place-victim`),ct(`nearest`,0,1)]},{id:`el-suelo-esta-temblando`,name:`«¡El suelo está temblando!»`,copies:2,image:`${ot}/horror/el-suelo-esta-temblando.webp`,text:`Pon al Poltergeist en tu espacio. Objetivo el más cercano ▶ atacar. Si recibes cualquier daño, todos tus movimientos durante la siguiente fase de Acción tienen pánico.`,effects:[lt(`pg-place-fg`),lt(`pg-mark`),ct(`nearest`,0,1),lt(`pg-panic-if-hurt`)]},{id:`maldad-imparable`,name:`Maldad imparable`,copies:1,image:`${ot}/horror/maldad-imparable.webp`,text:`Tira un dado. Recibe daño igual a tu tirada (te puedes defender) O mata ese mismo número de Víctimas (tú eliges cuáles). Si no hay suficientes Víctimas, debes elegir recibir el daño.`,effects:[lt(`pg-evil`)]},{id:`de-donde-ha-salido-esta-tormenta`,name:`«¿De dónde diablos ha salido esta tormenta?»`,copies:1,image:`${ot}/horror/de-donde-ha-salido-esta-tormenta.webp`,text:`¡El rayo impacta en tu espacio y en todos los adyacentes! Una Víctima en cada espacio muere, y tú pierdes tanta Vida como el valor de ataque actual del Poltergeist.`,effects:[lt(`pg-storm`)]},{id:`nada-es-lo-que-parece`,name:`Nada es lo que parece`,copies:1,image:`${ot}/horror/nada-es-lo-que-parece.webp`,text:`Si Carolyn está contigo, descarta y roba la siguiente carta de Terror. Si no: baraja cada mazo de Objetos y revela la carta superior de cada uno. Si se revela Carolyn o Mr. Floppy, +2 Sed de Sangre.`,skipIf:`carolyn`,effects:[lt(`pg-nothing`)]},{id:`tengo-que-matarte`,name:`«¡Tengo que matarte! ¡Me dijo que te matara!»`,copies:1,image:`${ot}/horror/tengo-que-matarte.webp`,text:`Si no hay Víctimas en el tablero, descarta y roba la siguiente carta de Terror. Si no: todas las Víctimas de espacios adyacentes se mueven a tu espaci
