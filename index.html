osque-oeste":1,mirador:1,puente:2,"arboles-sagrados":2,orilla:2,"bosque-este":2,poblado:2}}],eventBack:`${T}/events/back.webp`,events:[{id:`cerrado-por-mantenimiento`,name:`Cerrado por mantenimiento`,image:`${T}/events/cerrado-por-mantenimiento.webp`,flavor:`«Menos mal que hay un espacio sagrado menos para que desfilen estos pringados.»`,text:`Cuando se revele, puedes descartar TODAS tus cartas de Acción excepto Expiar para cerrar un espacio Sagrado: coloca allí la ficha de Cerrado y mueve sus Víctimas a los espacios adyacentes (repartidas). Las Víctimas ya no pueden entrar allí por ninguna razón; tú y los Enemigos sí podéis entrar y salir.`,token:`cerrado`,onReveal:[],persistent:!0,custom:`ev-closed`},{id:`fuego-y-azufre`,name:`Fuego y azufre`,image:`${T}/events/fuego-y-azufre.webp`,flavor:`«Aparentemente este sitio es mega sagrado, así que mejor trabajo extra duro para mantener a esta gentuza alejada.»`,text:`Tira un dado y coloca la ficha de Fuego y azufre en: 1-2 Cementerio, 3-4 Santuario Sagrado, 5-6 Árboles Sagrados. Cada Víctima de ese espacio cuenta como 2 Víctimas al calcular los Aumentos de la Ira Divina.`,token:`fuego-y-azufre`,onReveal:[],persistent:!0,custom:`ev-fire-brimstone`},{id:`suelo-sagrado`,name:`Suelo sagrado`,image:`${T}/events/suelo-sagrado.webp`,flavor:`«No invierto demasiado en lo sobrenatural pero aún así siento que este lugar es diferente.»`,text:`Tira un dado y coloca la ficha de Suelo sagrado en: 1-2 Cementerio, 3-4 Santuario Sagrado, 5-6 Árboles Sagrados. Cada vez que terminas una fase de Acción en ese espacio, ganas 2 Tiempo.`,token:`suelo-sagrado`,onReveal:[],persistent:!0,custom:`ev-sacred-ground`},{id:`el-super-turista`,name:`El super turista`,image:`${T}/events/el-super-turista.webp`,flavor:`«¡HULA! ¡MI NOMBRE ES FRANZ! ¡NO, NO ESTOY GRITANDO! ¡MI VOZ ES ASÍ!»`,text:`La Víctima más alejada del Asesino es ahora el Super Turista. Cada vez que el Asesino elija Objetivo, elige al Super Turista. Si el Super Turista es salvado, reduce la Ira Divina o la Asesina en 4. Si muere, aumenta la Ira Divina en 4. Si el Super Turista deja de jugar, descarta esta carta.`,specialVictim:`white`,onReveal:[],persistent:!0,custom:`ev-super-tourist`},{id:`el-hombre-sagrado`,name:`El hombre sagrado`,image:`${T}/events/el-hombre-sagrado.webp`,flavor:`«¿Qué tipo de peregrino demente es este tipo?»`,text:`La Víctima más alejada del Asesino es ahora el Hombre Sagrado. No te sigue. En cada fase de Mantenimiento se mueve un espacio hacia el Asesino. Cuando esté en el mismo espacio que el Asesino, quítalo del tablero: si estabas en su espacio, reduce la Ira Asesina o la Divina a 4; si no, aumenta la Ira Asesina y la Divina 10 en total (tú eliges). Si el Hombre Sagrado deja de jugar, descarta esta carta.`,specialVictim:`blue`,onReveal:[],persistent:!0,custom:`ev-holy-man`},{id:`el-guia-turistico`,name:`El guía turístico`,image:`${T}/events/el-guia-turistico.webp`,flavor:`«Y si miran a su derecha verán… Oh cielos… eso es terrorífico. ¿Quizá deberíamos tomar una ruta distinta?»`,text:`La Víctima más cercana a ti es el Guía Turístico. Mientras esté contigo, una vez por turno, cuando te muevas al menos 1 espacio, puedes moverte otro adicional. Si el Guía Turístico muere, aumenta la Ira Divina en 6. Si deja de jugar, descarta esta carta.`,specialVictim:`green`,onReveal:[],persistent:!0,custom:`ev-tour-guide`},{id:`ruidosos-y-odiosos`,name:`Ruidosos y odiosos`,image:`${T}/events/ruidosos-y-odiosos.webp`,flavor:`«Estos turistas son tan molestos que me dan ganas de matarlos a mí misma.»`,text:`Cada vez que la Ira Divina aumente, auméntala 1 más.`,onReveal:[],persistent:!0,custom:`ev-loud-obnoxious`},{id:`los-dioses-odian-los-fallos`,name:`Los dioses odian los fallos`,image:`${T}/events/los-dioses-odian-los-fallos.webp`,flavor:`«Igual podríamos añadir a los dioses a la lista de la gente que piensa que soy un desastre.»`,text:`Cada vez que falles del todo una Tirada de Terror (después de modificaciones), aumenta la Ira Divina en 1.`,onReveal:[],persistent:!0,custom:`ev-gods-hate-failure`},{id:`matanza-impia`,name:`Matanza impía`,image:`${T}/events/matanza-impia.webp`,flavor:`«Supongo que los dioses no se tomen a bien la sangría de estos turistas sobre sus altares sagrados.»`,text:`Cada vez que una Víctima es asesinada en un espacio Sagrado, Desata la Ira Divina.`,onReveal:[],persistent:!0,custom:`ev-unholy-slaughter`},{id:`fotografia-con-flash`,name:`Fotografía con flash`,image:`${T}/events/fotografia-con-flash.webp`,flavor:`«¡Apunta con esa cámara a otra parte, aprendiz de paparazzi!»`,text:`Cada vez que al menos 1 Víctima de tu espacio huya, descarta al azar 1 carta de Acción de tu mano.`,onReveal:[],persistent:!0,custom:`ev-flash-photo`}],horror:[{id:`la-ira-de-los-dioses`,name:`La ira de los dioses`,copies:1,image:`${T}/horror/la-ira-de-los-dioses.webp`,text:`Roba un Evento ▶ aumenta la Ira Divina tanto como Víctimas haya en espacios Sagrados ▶ coloca al Asesino en el espacio Sagrado con más Víctimas (o en tu espacio si no quedan) ▶ objetivo el más cercano ▶ atacar ▶ atacar.`,effects:[{kind:`drawEvent`},xe,{kind:`custom`,id:`killer-to-busiest-sacred`},ye(`nearest`,0,2)]},{id:`la-furia-de-los-dioses`,name:`La furia de los dioses`,copies:1,image:`${T}/horror/la-furia-de-los-dioses.webp`,text:`Roba un Evento ▶ aumenta la Ira Divina tanto como Víctimas haya en espacios Sagrados ▶ Desata la Ira Divina ▶ vuelve a aumentarla tanto como Víctimas haya en espacios Sagrados.`,effects:[{kind:`drawEvent`},xe,Se,xe]},{id:`dejame-grabar-mis-iniciales`,name:`«Déjame grabar mis iniciales justo aquí…»`,copies:1,image:`${T}/horror/dejame-grabar-mis-iniciales.webp`,text:`Aumenta la Ira Divina tanto como Víctimas haya en espacios Sagrados ▶ Desata la Ira Divina ▶ coloca 2 nuevas Víctimas en el Santuario Sagrado ▶ todas las Víctimas adyacentes al Santuario Sagrado se mueven allí.`,effects:[xe,Se,{kind:`placeVictims`,count:2,where:{zone:`santuario`}},{kind:`custom`,id:`gather:santuario`}]},{id:`nadie-se-dara-cuenta`,name:`«Nadie se dará cuenta si rompo una de estas preciosas ramas»`,copies:1,image:`${T}/horror/nadie-se-dara-cuenta.webp`,text:`Aumenta la Ira Divina tanto como Víctimas haya en espacios Sagrados ▶ Desata la Ira Divina ▶ coloca 2 nuevas Víctimas en los Árboles Sagrados ▶ todas las Víctimas adyacentes a los Árboles Sagrados se mueven allí.`,effects:[xe,Se,{kind:`placeVictims`,count:2,where:{zone:`arboles-sagrados`}},{kind:`custom`,id:`gather:arboles-sagrados`}]},{id:`trampa-de-turistas`,name:`Trampa de turistas`,copies:1,image:`${T}/horror/trampa-de-turistas.webp`,text:`Todas las Víctimas adyacentes a un espacio Sagrado se mueven allí ▶ aumenta la Ira Divina tanto como Víctimas haya en espacios Sagrados ▶ objetivo el más cercano ▶ mover ▶ atacar.`,effects:[{kind:`custom`,id:`gather:sacred`},xe,ye(`nearest`,1,1)]},{id:`si-me-subo-a-esa-estatua`,name:`«Si me subo a lo alto de esa estatua puedo hacerme un selfie que te mueres»`,copies:1,image:`${T}/horror/si-me-subo-a-esa-estatua.webp`,text:`Aumenta la Ira Divina tanto como Víctimas haya en espacios Sagrados ▶ Desata la Ira Divina ▶ coloca 2 nuevas Víctimas en el Cementerio ▶ todas las Víctimas adyacentes al Cementerio se mueven allí.`,effects:[xe,Se,{kind:`placeVictims`,count:2,where:{zone:`cementerio`}},{kind:`custom`,id:`gather:cementerio`}]},{id:`castigo-divino`,name:`Castigo divino`,copies:1,image:`${T}/horror/castigo-divino.webp`,text:`Desata la Ira Divina ▶ Desátala otra vez ▶ objetivo el más cercano ▶ mover ▶ atacar ▶ roba un Evento.`,effects:[Se,Se,ye(`nearest`,1,1),{kind:`drawEvent`}]},{id:`la-volubilidad-de-los-dioses`,name:`La volubilidad de los dioses`,copies:1,image:`${T}/horror/la-volubilidad-de-los-dioses.webp`,text:`Queda en juego junto a la Ira Divina. Al final de cada fase de Mantenimiento, haz una Tirada de Terror. 2+ éxitos: reduce la Ira Divina o la Asesina en 1. 1 éxito: sin efecto. Sin éxitos: Desata la Ira Divina y auméntala tanto como Víctimas haya en espacios Sagrados. Puedes gastar 3 Tiempo durante la fase de Acción para descartar esta carta.`,effects:[],stays:`hz-fickle-gods`}],items:[{id:`tapadera`,name:`Tapadera`,image:`${T}/items/tapadera.webp`,flavor:`«Discúlpame mientras ¡SACO LA BASURA! Je je, ¿lo pillas?»`,text:`Ignora 1 punto de daño de un ataque. 3 usos.`,hands:1,uses:3,custom:`item-trash-lid`},{id:`daga-ceremonial`,name:`Daga ceremonial`,image:`${T}/items/daga-ceremonial.webp`,flavor:`«A los dioses siempre les gustó un poco de sangría, así que no sería bueno decepcionarles.»`,text:`Arma: alcance 0, +1 de daño. Cada vez que haces daño al Asesino, elige la Ira Asesina o la Divina y redúcela en 1.`,hands:1,range:[0,0],damage:1,modifies:`any`,custom:`item-ceremonial-dagger`},{id:`pildoras-misteriosas`,name:`Píldoras misteriosas`,image:`${T}/items/pildoras-misteriosas.webp`,flavor:`«Por favor, que no sean un laxante.»`,text:`Descártalas durante la fase de Acción y elige: −1 Terror o recupera 2 Vida.`,hands:0,custom:`item-mystery-pills`},{id:`huesos-del-shaman`,name:`Huesos del shamán`,image:`${T}/items/huesos-del-shaman.webp`,flavor:`«Nada como los huesos de un tipo sagrado cuando necesitas asomarte al futuro.»`,text:`Mira la siguiente carta de Horror y colócala encima o debajo del todo del mazo de Horror. 3 usos.`,hands:1,uses:3,custom:`item-shaman-bones`},{id:`mascara-tribal`,name:`Máscara tribal`,image:`${T}/items/mascara-tribal.webp`,flavor:`«¿Por qué solo van a divertirse con las máscaras los maníacos?»`,text:`Cada vez que recibes daño, elige la Ira Asesina o la Divina y redúcela tanto como el daño recibido.`,hands:0,custom:`item-tribal-mask`},{id:`bebida-energetica`,name:`Bebida energética`,image:`${T}/items/bebida-energetica.webp`,flavor:`«Zoom zoom, baby, ¡mira cómo voy!»`,text:`Descártala durante la fase de Acción y elige: +3 Tiempo o muévete 1 zona.`,hands:0,custom:`item-energy-drink`},{id:`viejo-rifle`,name:`Viejo rifle`,image:`${T}/items/viejo-rifle.webp`,flavor:`«Este cacharro no se ha limpiado en una década, pero ¡rayos, aún puede disparar!»`,text:`Arma: alcance 1-2, sin daño adicional. Solo puede modificar la carta de Acción Ataque débil. Si estás en un espacio Sagrado, +2 al alcance máximo.`,hands:2,range:[1,2],damage:0,modifies:[`ataque-debil`],custom:`item-old-rifle`},{id:`palo-de-guerra`,name:`Palo de guerra`,image:`${T}/items/palo-de-guerra.webp`,flavor:`«Este palo es solo de exposición, pero es hora de ponerlo a funcionar.»`,text:`Arma: alcance 0, +1 de daño. Cada vez que haces daño con el Palo de guerra, elige la Ira Asesina o la Divina y redúcela tanto como el daño infligido.`,hands:2,range:[0,0],damage:1,modifies:`any`,custom:`item-war-club`},{id:`kit-de-primeros-auxilios`,name:`Kit de primeros auxilios`,image:`${T}/items/kit-de-primeros-auxilios.webp`,flavor:`«Tengo que parar la hemorragia antes de perder la consciencia.»`,text:`Cada vez que uses una carta de Acción para recuperar Vida, recupera 1 más.`,hands:1,custom:`item-first-aid`},{id:`senales-fuera-de-servicio`,name:`Señales de fuera de servicio`,image:`${T}/items/senales-fuera-de-servicio.webp`,flavor:`«Un poco de confusión vendrá bien.»`,text:`Por 1 Tiempo, coloca o retira una ficha de Fuera de servicio en la unión entre tu espacio y uno adyacente (2 fichas). Las Víctimas no pasarán por ella, a menos que te estén siguiendo.`,hands:0,token:`fuera-de-servicio`,custom:`item-out-of-order`},{id:`bocina`,name:`Bocina`,image:`${T}/items/bocina.webp`,flavor:`«La herramienta perfecta para pastorear a estos cabeza-huecas de turistas.»`,text:`Por 1 Tiempo, todas las Víctimas de tu espacio y de los adyacentes huyen.`,hands:0,custom:`item-air-horn`},{id:`incienso`,name:`Incienso`,image:`${T}/items/incienso.webp`,flavor:`«Parece ser que a los dioses les gusta el humo que huele bien. Oye, lo que sea, ¡funciona!»`,text:`Cada vez que la Ira Asesina o la Divina aumente, auméntala 1 menos (aumento mínimo de 1).`,hands:0,custom:`item-incense`},{id:`spray-pimienta`,name:`Spray de pimienta`,image:`${T}/items/spray-pimienta.webp`,flavor:`«Se
